<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action="">

        <label for="Firstname">Firstname</label>
        <input type="text" placeholder="enter your first name" name="name" id="name" />

        <br />
        <br />

        <label for="Lastname">Lastname</label>
        <input type="text" placeholder="enter your last name" name="name" id="name" />

        <br />
        <br />

        <label for="password">password</label>
        <input type="password" />

        <br />
        <br/>

        <label for="email">email</label>
        <input type="email" />

        <br />
        <br />

        <label for="Phonenumber">Phonenumber</label>
        <input type="tel" placeholder="enter your phonenumber" />

        <br />
        <br />

        <label for="Number">Number</label>
        <input type="Number" placeholder="enter your number"/>

        <br />
        <br />

        <label for="Favouritecolor">Color</label>
        <input type="Color" />

        <br />
        <br />

        <label for="Time">time</label>
        <input type="time" />

        <br />
        <br />

        <label for="Date">date</label>
        <input type="date" />

        <br />
        <br />

        <label for="week">week</label>
        <input type="week" />

        <br />
        <br />

        <label for="Month">month</label>
        <input type="month"/>

        <br />
        <br />

        <label for="Search">search</label>
        <input type="search" />

        <br />
        <br />

        <label for="Volume">volume</label>
        <input type="range" />

        <br />
        <br />

        <label for="link">link</label>
        <input type="url" />

        <br />
        <br />

        <label for="country">country</label>
        <select name="" id="">
        <option value="India">India</option>
        <option value="Australia" selected>Australia</option>
        <option value="USA">USA</option>
        <option value="London">London</option>
        </select>

        <br />
        <br />

        <label for="yes">yes</label>
        <input type="checkbox" />

        <br />
        <br />

        <label for="Yes">Yes</label> 
        <input type="radio" name="radio" id="radio"/> 
        <label for="No">No</label>
        <input type="radio" name="radio" id="radio" /> 

        <br />
        <br />

        <label for="Address">Address</label>
        <textarea 
        name="" 
        id=""
        rows="5"
        cols="10"
        placeholder="enter your address">
        </textarea>

        <br />
        <br />

        <label for="file">file</label>
        <input type="file" />

        <br />
        <br />

        <button>button</button>

        <br />
        <br />

        <button type="submit">submit</button>
        <button type="reset">reset</button>

    </form>
</body>
</html>
