<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Elements</title>
</head>
<body>
    <!-- Inline Elements -->

    <!-- Inline Elements are elements which can occupy space has per its need and do not start with new line -->

    <!-- Italic tag -->
    <i>This is italic</i>

    <br>

    <!-- Emphasize tag -->
    <em>This is Emphasize</em>

    <br>

    <!-- Bold tag -->
    <b>This is Bold</b>

    <br>

    <!-- Strong tag -->
    <strong>This is strong</strong>

    <br>

    <!-- Underline tag -->
    <u>This is Underline</u>

    <br>

    <!-- Small tag -->
    <small>This is small</small>

    <br>

    <!-- Sub tag -->
    <h1>h2o</h1>

    <h1>h<sub>2</sub>o</h1>

    <br>

    <!-- Sup tag -->

    <h1>e=mc2</h1>

    <h1>e=mc<sup>2</sup></h1>

    <br>

    <!-- Deleted tag -->
    <del>This is deleted</del>

    <br>

    <!-- Highlight tag -->
    <mark>This is mark</mark>

    <br>

    <!-- Inserted tag -->
    <ins>This is inserted</ins>

    <br>

    <s>This is s</s>

</body>
</html>
