<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <!-- Order List -->

    <ol>
        <li>List-1</li>
        <li>List-2</li>
        <li>List-3</li>
        <li>List-4</li>
        <li>List-5</li>
    </ol>

    <!-- Unorder List -->

    <ul>
        <li>List-1</li>
        <li>List-2</li>
        <li>List-3</li>
        <li>List-4</li>
        <li>List-5</li>
    </ul>

    <!-- Now With Attribute -->

    <ol type="A">
        <li>List-1</li>
        <li>List-2</li>
        <li>List-3</li>
        <li>List-4</li>
        <li>List-5</li>
    </ol>

    <!-- Description List -->

    <dl>
        <dt>Fruits</dt>
        <dd>Cherry</dd>
        <dd>Grapes</dd>
        <dd>Apples</dd>
        <dd>Guava</dd>
        <dd>Pineapple</dd>
    </dl>
</body>
</html>
