<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Elements</title>
</head>
<body>
    <!-- Block Elements -->

    <!-- Block Elements will occupy full width and always start with new line -->

    <!-- Heading Tag -->

    <h1>heading 1</h1>
    <h2>heading 2</h2>
    <h3>heading 3</h3>
    <h4>heading 4</h4>
    <h5>heading 5</h5>
    <h6>heading 6</h6>

    <!-- Paragraph Tag -->

    <p>This is para-1</p>
    <p>This is para-2</p>

    <!-- Horizontal line -->

    <hr>

    <!-- Break line -->

    <br>
</body>
</html>
